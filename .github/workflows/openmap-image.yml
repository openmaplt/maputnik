name: openmap.lt image

# Builds the Docker image of the editor, pushes it to GitHub Container Registry
# as ghcr.io/openmaplt/maputnik (latest = main) and redeploys it on the server
# over SSH, the same way openmap.lt itself is deployed (see openmap/README.md for
# the secrets this needs).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: openmap/image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: Log in to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: openmap/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: openmap/deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          COMMIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: COMMIT_SHA
          script: |
            set -e
            mkdir -p ${{ secrets.EDITOR_DEPLOY_PATH || '/opt/openmap-editor' }}
            cd ${{ secrets.EDITOR_DEPLOY_PATH || '/opt/openmap-editor' }}

            echo "EDITOR_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" > .env
            echo "EDITOR_PORT=${{ secrets.EDITOR_PORT || '3002' }}" >> .env

            # Always use the compose file of the commit being deployed.
            curl -fsSL -o docker-compose.yml "https://raw.githubusercontent.com/${{ github.repository }}/$COMMIT_SHA/openmap/docker-compose.yml"

            echo ${{ secrets.GHCR_PAT }} | docker login ${{ env.REGISTRY }} -u ${{ secrets.GHCR_USER || 'paumas' }} --password-stdin

            docker compose pull
            # Recreates the container only when the image changed.
            docker compose up -d
            docker image prune -f
            docker compose ps
