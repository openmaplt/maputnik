server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The editor is only ever opened on its own: no embedding. The token in the
    # URL is removed by the app itself, and no Referer is sent anywhere.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Hashed build output never changes: cache it for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else (index.html, locales, ...) is revalidated, and unknown
    # paths fall back to the app.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
