# The openmap.lt editor image built by .github/workflows/openmap-image.yml.
# The workflow copies this file to the server and runs `docker compose pull`
# and `up -d` after every push to main, so nobody has to log in to redeploy.
# To run it by hand:
#
#   docker login ghcr.io          # with a token that can read the package
#   docker compose -f openmap/docker-compose.yml pull
#   docker compose -f openmap/docker-compose.yml up -d
#
# The port is bound to 127.0.0.1 only: the host's nginx proxies
# editor.openmap.lt to it (see openmap/README.md).
services:
  editor:
    image: ${EDITOR_IMAGE:-ghcr.io/openmaplt/maputnik:latest}
    container_name: openmap-editor
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EDITOR_PORT:-3001}:80"
